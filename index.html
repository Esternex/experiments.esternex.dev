<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiments | Esternex</title>
    
    <style>
        :root {
            --bg-color: #111111;
            --text-color: #ededed;
            --secondary-text: #888888;
            --card-bg: #1a1a1a;
            --border-color: #333333;
            --hover-border: #666666;
            --hover-bg: #1e1e1e;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 800px;
            margin-top: 6vh;
        }

        /* --- Header Styling --- */
        .back-link {
            display: inline-block;
            margin-bottom: 2rem;
            color: var(--secondary-text);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s ease;
        }

        .back-link:hover {
            color: var(--text-color);
        }

        header {
            margin-bottom: 3rem;
        }

        h1 {
            font-weight: 600;
            margin: 0 0 0.5rem 0;
            letter-spacing: -0.5px;
            font-size: 2.2rem;
        }

        .subtitle {
            color: var(--secondary-text);
            margin: 0;
            font-size: 1.05rem;
        }

        /* --- Grid & Card Styling --- */
        .experiments-grid {
            display: grid;
            /* Creates a responsive grid that automatically wraps cards */
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .experiment-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            transition: all 0.2s ease;
        }

        .experiment-card:hover {
            border-color: var(--hover-border);
            background-color: var(--hover-bg);
            transform: translateY(-2px);
        }

        .experiment-title {
            font-weight: 600;
            font-size: 1.15rem;
            margin: 0 0 0.5rem 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* Small animated arrow on hover */
        .experiment-title::after {
            content: "→";
            color: var(--secondary-text);
            font-family: ui-monospace, SFMono-Regular, monospace;
            transition: transform 0.2s ease, color 0.2s ease;
        }

        .experiment-card:hover .experiment-title::after {
            transform: translateX(4px);
            color: var(--text-color);
        }

        .experiment-desc {
            color: var(--secondary-text);
            font-size: 0.95rem;
            margin: 0;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <a href="https://esternex.dev" class="back-link">← back to esternex.dev</a>
        
        <header>
            <h1>my experiments</h1>
            <p class="subtitle">A collection of web tools, scripts, and small projects.</p>
        </header>

        <div class="experiments-grid">
            
            <!-- ========================================== -->

            <a href="/miditogmd" class="experiment-card">
                <div class="experiment-title">MidiToGMD</div>
                <p class="experiment-desc">Browser-based converter that turns standard MIDI files into playable GMD files using a virtual Python runtime.</p>
            </a>

            <!-- ========================================== -->
            <!-- TO HERE                                    -->
            <!-- ========================================== -->

        </div>
    </div>

</body>
</html>
